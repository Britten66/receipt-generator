name: CI Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # 9am UTC every Monday

# Allow GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    working-directory: frontend

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/ci \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/react \
            --config=p/typescript \
            --exclude='frontend/node_modules' \
            --exclude='frontend/dist' \
            --exclude='frontend/playwright-report' \
            --exclude='frontend/test-results' \
            --error

  security-pipeline:
    name: Security Tests + Build + Report
    runs-on: ubuntu-latest
    # Backstop so a hung step can never burn the full 6h GitHub job limit again.
    # Runs #335/#336 hung 6h on the Playwright browser download, #338 hung 12m.
    # 45m covers a one-time cache-miss browser download plus the E2E run.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js 24
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=high

      - name: Run security tests
        run: npm test

      - name: Build for production
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # The Chromium binary download from cdn.playwright.dev stalls on the
      # runner: it ran 6h on #335/#336 and 12m on #338, always on the download
      # step, never on the apt deps. Cache the browser so it downloads once
      # instead of every run, and keep the bootstrap download on its own
      # retried, capped step so a stalled connection recovers without hanging.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Download Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            timeout 600 npx playwright install chromium && exit 0
            echo "Playwright download attempt $attempt stalled; retrying..."
            sleep 5
          done
          echo "Playwright download failed after 3 attempts"
          exit 1

      - name: Run E2E tests
        run: npx playwright test --workers=4
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Anonymize and group Allure results for portfolio
        if: always()
        run: node scripts/anonymize-allure-portfolio.cjs

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: frontend/allure-report
          retention-days: 30

      - name: Deploy Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/allure-report
          publish_branch: gh-pages
