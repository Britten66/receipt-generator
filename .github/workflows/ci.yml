name: CI Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # 9am UTC every Monday

# Allow GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    working-directory: frontend

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-scan:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/ci \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/react \
            --config=p/typescript \
            --exclude='frontend/node_modules' \
            --exclude='frontend/dist' \
            --exclude='frontend/playwright-report' \
            --exclude='frontend/test-results' \
            --error

  security-pipeline:
    name: Security Tests + Build + Report
    runs-on: ubuntu-latest
    # Backstop so a hung step can never burn the full 6h GitHub job limit again.
    # No browser download now (CI uses the runner's preinstalled Chrome), so
    # 30m covers build plus the E2E run with headroom.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=high --omit=dev

      - name: Run security tests
        run: npm test

      - name: Build for production
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # CI cannot reliably download Playwright's bundled Chromium: the
      # cdn.playwright.dev fetch stalls on the runner (6h on #335/#336, 12m on
      # #338, and again on #339). Use the Google Chrome the runner image ships
      # with (playwright.config sets channel:chrome under CI) and install only
      # the apt libs, which have always completed in seconds.
      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npx playwright test --workers=4
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Anonymize and group Allure results for portfolio
        if: always()
        run: node scripts/anonymize-allure-portfolio.cjs

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: allure-report
          path: frontend/allure-report
          retention-days: 30

      - name: Deploy Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847  # v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/allure-report
          publish_branch: gh-pages
