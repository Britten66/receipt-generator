    <script>
      try {
        var stored = localStorage.getItem("dark_mode");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = stored !== null ? stored === "1" : prefersDark;
        if (isDark) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.style.background = "#2c3032";
        } else {
          document.documentElement.style.background = "#dcdcda";
        }
        if (stored === null) localStorage.setItem("dark_mode", isDark ? "1" : "0");
      } catch {}
    </script>
